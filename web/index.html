<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Loja de roupas do MZ Framework" />
    <title>Loja de roupas MZ</title>
    <link rel="stylesheet" href="style.css?v=20261015store1" />
  </head>
  <body>
    <main id="app" class="app" aria-hidden="true">
      <aside class="camera-panel" aria-label="Controles da visualizacao">
        <span class="eyebrow">Provador</span>
        <strong>Veja no personagem</strong>
        <div id="camera-modes" class="camera-modes"></div>
        <div class="camera-actions">
          <button id="rotate-left" type="button" aria-label="Girar personagem para a esquerda">↶</button>
          <button id="rotate-right" type="button" aria-label="Girar personagem para a direita">↷</button>
          <button id="zoom-in" type="button" aria-label="Aproximar camera">+</button>
          <button id="zoom-out" type="button" aria-label="Afastar camera">−</button>
        </div>
      </aside>

      <section class="store-panel" aria-labelledby="shop-title">
        <header class="header">
          <div><span class="eyebrow">MZ Clothing</span><h1 id="shop-title">Loja de roupas</h1></div>
          <span class="esc-hint">ESC <small>fechar</small></span>
        </header>

        <nav class="tabs" aria-label="Secoes da loja">
          <button class="tab active" data-tab="catalog" type="button">Comprar</button>
          <button class="tab" data-tab="outfits" type="button">Outfits</button>
        </nav>

        <section id="catalog-view" class="view catalog-view">
          <nav id="categories" class="categories" aria-label="Categorias de roupa"></nav>
          <section class="product" aria-live="polite">
            <div class="product-heading">
              <span id="selection-group" class="eyebrow">Categoria</span>
              <h2 id="selection-label">Escolha uma roupa</h2>
              <p id="selection-tech" class="selection-tech">A aparencia sera mostrada no personagem.</p>
            </div>

            <div class="selectors">
              <div class="selector-row">
                <div><small>Modelo</small><strong id="model-value">—</strong></div>
                <div class="stepper">
                  <button id="model-prev" type="button" aria-label="Modelo anterior">←</button>
                  <button id="model-next" type="button" aria-label="Proximo modelo">→</button>
                </div>
              </div>
              <div class="selector-row">
                <div><small>Textura</small><strong id="texture-value">—</strong></div>
                <div class="stepper">
                  <button id="texture-prev" type="button" aria-label="Textura anterior">←</button>
                  <button id="texture-next" type="button" aria-label="Proxima textura">→</button>
                </div>
              </div>
            </div>

            <footer class="checkout">
              <div><small>Preco</small><strong id="selection-price">$0</strong></div>
              <button id="buy" class="primary" type="button">Comprar para a bag</button>
            </footer>
          </section>
        </section>

        <section id="outfits-view" class="view hidden">
          <form id="outfit-form" class="outfit-form">
            <label for="outfit-name">Salvar roupa equipada</label>
            <div><input id="outfit-name" name="outfit-name" maxlength="32" placeholder="Ex.: Trabalho…" autocomplete="off" /><button class="primary" type="submit">Salvar</button></div>
          </form>
          <div id="outfits" class="outfits"></div>
        </section>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="script.js?v=20261015store1"></script>
  </body>
</html>
